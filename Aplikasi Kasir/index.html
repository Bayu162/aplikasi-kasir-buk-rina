<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir Bu Rina</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div><h1>Kasir Bu Rina</h1><p>Aplikasi Kasir Warung</p></div>
  <span id="tanggal"></span>
</header>

<main class="container">
  <nav class="tabs">
    <button class="tab active" data-page="kasir">Kasir</button>
    <button class="tab" data-page="produk">Data Produk</button>
    <button class="tab" data-page="riwayat">Riwayat Transaksi</button>
  </nav>

  <section id="page-kasir" class="page">
    <div class="stats">
      <article><small>Penjualan Hari Ini</small><strong id="penjualanHariIni">Rp0</strong></article>
      <article><small>Transaksi Hari Ini</small><strong id="jumlahTransaksi">0</strong></article>
      <article><small>Jumlah Produk</small><strong id="jumlahProduk">0</strong></article>
    </div>

    <div class="layout">
      <section class="card">
        <div class="section-heading"><h2>Daftar Produk</h2></div>
        <input type="search" id="cariProduk" placeholder="Cari nama produk...">
        <div id="daftarProduk" class="product-grid"></div>
      </section>

      <section class="card">
        <h2>Keranjang Belanja</h2>
        <div id="keranjang"><p class="empty">Belum ada produk dipilih.</p></div>
        <div class="total-line"><span>Total</span><strong id="total">Rp0</strong></div>
        <label for="uangBayar">Uang Pembayaran</label>
        <input type="number" id="uangBayar" min="0" placeholder="Masukkan jumlah uang">
        <div class="total-line"><span>Kembalian</span><strong id="kembalian">Rp0</strong></div>
        <button id="btnBayar" class="btn btn-primary full">Selesaikan Transaksi</button>
        <button id="btnKosongkan" class="btn btn-light full">Kosongkan Keranjang</button>
      </section>
    </div>
  </section>

  <section id="page-produk" class="page hidden">
    <section class="card">
      <h2 id="judulFormProduk">Tambah Produk</h2>
      <form id="formProduk">
        <input type="hidden" id="idProduk">
        <div class="form-grid">
          <div><label for="namaProduk">Nama Produk</label><input id="namaProduk" required maxlength="100"></div>
          <div><label for="hargaProduk">Harga (Rp)</label><input id="hargaProduk" type="number" min="1" required></div>
          <div><label for="stokProduk">Stok</label><input id="stokProduk" type="number" min="0" value="0" required></div>
        </div>
        <div class="button-row">
          <button class="btn btn-primary" type="submit" id="btnSimpanProduk">Simpan Produk</button>
          <button class="btn btn-light hidden" type="button" id="btnBatalEdit">Batal</button>
        </div>
      </form>
    </section>
    <section class="card">
      <h2>Daftar Produk</h2>
      <div class="table-wrap" id="tabelProduk"></div>
    </section>
  </section>

  <section id="page-riwayat" class="page hidden">
    <section class="card">
      <h2>Riwayat Transaksi</h2>
      <div class="table-wrap" id="tabelRiwayat"></div>
    </section>
  </section>
</main>
<footer>Kasir Bu Rina | Projek Kreatif dan Kewirausahaan</footer>
<script src="js/app.js"></script>
</body>
</html>
